[project]
name = "blackbook"
version = "0.0.1"
description = "Local organizer for 1010music blackbox 2 microSD cards"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are maintained in requirements.txt and requirements-dev.txt

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbook"]

[tool.ruff]
line-length = 100
