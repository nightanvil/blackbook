[project]
name = "bb2-organizer"
version = "0.0.1"
description = "Local organizer for 1010music blackbox 2 microSD cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bb2org"]

[tool.ruff]
line-length = 100
